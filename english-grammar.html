<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英语语法大全 · 独立总览</title>
  <link rel="stylesheet" href="grade4-learning.css">
  <style>
    .language-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      background: #1565c0;
    }
    .lang-btn {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 18px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 18px;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      transition: all 0.3s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.25); }
    .lang-btn.active { color: #1565c0; background: #fff; border-color: #fff; }

    .course-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      flex-wrap: wrap;
    }

    .course-switcher .grade-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 18px;
    }

    .course-switcher .grade-label {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      padding: 3px 6px;
      background: rgba(0,0,0,0.15);
      border-radius: 8px;
      white-space: nowrap;
    }

    .course-switcher .grade-btn {
      flex: 0 0 auto;
      min-height: 28px;
      padding: 5px 12px;
      border: none;
      border-radius: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.9);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .course-switcher .grade-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .course-switcher .grade-btn.active {
      color: #172033;
      background: #fff;
    }

    .course-switcher .grammar-btn {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      font-size: 12px;
      color: #fff;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      margin-left: 4px;
    }

    .course-switcher .grammar-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(240, 147, 251, 0.4);
    }

    .course-switcher .grammar-btn.active {
      color: #172033;
      background: #fff;
      border-color: #fff;
    }
  </style>
</head>
<body>
  <div class="language-switcher">
    <a href="三年级下册语文互动学习.html" class="lang-btn">📖 语文</a>
    <a href="english-grammar.html" class="lang-btn active">🔤 英语</a>
  </div>
  <div class="course-switcher">
    <div class="grade-group">
      <span class="grade-label">一年级</span>
      <a href="english-1a.html" class="grade-btn">上册</a>
      <a href="english-1b.html" class="grade-btn">下册</a>
    </div>
    <div class="grade-group">
      <span class="grade-label">二年级</span>
      <a href="english-2a.html" class="grade-btn">上册</a>
      <a href="english-2b.html" class="grade-btn">下册</a>
    </div>
    <div class="grade-group">
      <span class="grade-label">三年级</span>
      <a href="三年级上册英语互动学习.html" class="grade-btn">上册</a>
      <a href="english-learning.html" class="grade-btn">下册</a>
    </div>
    <div class="grade-group">
      <span class="grade-label">四年级</span>
      <a href="四年级上册英语互动学习.html" class="grade-btn">上册</a>
      <a href="四年级下册英语互动学习.html" class="grade-btn">下册</a>
    </div>
    <div class="grade-group">
      <span class="grade-label">五年级</span>
      <a href="english-5a.html" class="grade-btn">上册</a>
      <a href="english-5b.html" class="grade-btn">下册</a>
    </div>
    <a href="english-grammar.html" class="grammar-btn active">📚 语法</a>
  </div>

  <header class="hero">
    <h1>英语语法大全</h1>
    <p>独立总览 · 不按年级或上下册划分</p>
    <div class="action-bar">
      <button class="action-btn" onclick="startRandomPractice()">🎲 随机练习</button>
      <button class="action-btn" onclick="generateStudyPlan()">📅 学习计划</button>
    </div>
  </header>

  <nav class="nav-bar" id="grammarNav" aria-label="语法目录"></nav>
  <main class="wrap" id="grammarApp"></main>
  <footer class="footer">按目录先看分类，再点开规则和例句复习。</footer>

  <script src="grammar-guide-common.js"></script>
  <script src="english-grammar.js"></script>
</body>
</html>
