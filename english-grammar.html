<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英语语法大全 · 独立总览</title>
  <link rel="stylesheet" href="grade4-learning.css">
  <style>
    .language-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      background: #1565c0;
    }
    .lang-btn {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 7px 18px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 18px;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      transition: all 0.3s;
    }
    .lang-btn:hover { background: rgba(255,255,255,0.25); }
    .lang-btn.active { color: #1565c0; background: #fff; border-color: #fff; }

    .course-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      flex-wrap: wrap;
    }

    .course-switcher .grade-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 18px;
    }

    .course-switcher .grade-label {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      padding: 3px 6px;
      background: rgba(0,0,0,0.15);
      border-radius: 8px;
      white-space: nowrap;
    }

    .course-switcher .grade-btn {
      flex: 0 0 auto;
      min-height: 28px;
      padding: 5px 12px;
      border: none;
      border-radius: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.9);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .course-switcher .grade-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .course-switcher .grade-btn.active {
      color: #172033;
      background: #fff;
    }

    .course-switcher .grammar-btn {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 16px;
      font-size: 12px;
      color: #fff;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      margin-left: 4px;
    }

    .course-switcher .grammar-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(240, 147, 251, 0.4);
    }

    .course-switcher .grammar-btn.active {
      color: #172033;
      background: #fff;
      border-color: #fff;
    }

    .grammar-search-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .grammar-search-input {
      flex: 1 1 240px;
      min-height: 40px;
      padding: 10px 14px;
      border: 1px solid rgba(23,32,51,0.16);
      border-radius: 12px;
      font-size: 14px;
      color: #172033;
      background: #fff;
    }

    .grammar-search-input:focus {
      outline: none;
      border-color: #6f42c1;
      box-shadow: 0 0 0 3px rgba(111,66,193,0.14);
    }

    .grammar-search-clear {
      min-height: 40px;
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      background: #172033;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .grammar-search-clear:hover {
      background: #0f1728;
    }

    .grammar-search-tip {
      margin-top: 10px;
      font-size: 13px;
      color: #5b6475;
      line-height: 1.5;
    }

    .grammar-book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .grammar-book-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(111,66,193,0.16);
      border-radius: 12px;
      background: linear-gradient(135deg, #fbf8ff, #f5f8ff);
    }

    .grammar-book-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .grammar-book-labels {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grammar-book-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 4px 10px;
      border-radius: 999px;
      color: #6f42c1;
      background: #efe7ff;
      font-size: 12px;
      font-weight: 800;
    }

    .grammar-book-top h4 {
      font-size: 16px;
      color: #1f2937;
    }

    .grammar-book-top p {
      margin-top: 6px;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }

    .grammar-book-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      background: #fff;
      color: #6f42c1;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(31,41,55,0.08);
    }

    .grammar-book-link:hover {
      background: #f6f0ff;
    }

    .grammar-book-queries {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grammar-book-chip {
      min-height: 32px;
      padding: 6px 12px;
      border: 1px solid rgba(111,66,193,0.18);
      border-radius: 999px;
      color: #1f3b64;
      background: rgba(255,255,255,0.88);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .grammar-book-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(111,66,193,0.34);
      background: #fff;
      box-shadow: 0 6px 16px rgba(111,66,193,0.12);
    }

    .grammar-highlight {
      padding: 0 2px;
      border-radius: 4px;
      color: inherit;
      background: linear-gradient(transparent 35%, rgba(255,225,105,0.95) 35%);
    }

    @media (max-width: 640px) {
      .grammar-book-top {
        flex-direction: column;
      }

      .grammar-book-link {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="language-switcher">
    <a href="三年级下册语文互动学习.html" class="lang-btn">📖 语文</a>
    <a href="english-grammar.html" class="lang-btn active">🔤 英语</a>
  </div>
  <div class="course-switcher">
    <div class="grade-group">
      <span class="grade-label">一年级</span>
      <a href="english-1a.html" class="grade-btn">上册</a>
      <a href="english-1b.html" class="grade-btn">下册</a>
    </div>
    <div class="grade-group">
      <span class="grade-label">二年级</span>
      <a href="english-2a.html" class="grade-btn">上册</a>
      <a href="english-2b.html" class="grade-btn">下册</a>
    </div>
    <div class="grade-group">
      <span class="grade-label">三年级</span>
      <a href="三年级上册英语互动学习.html" class="grade-btn">上册</a>
      <a href="english-learning.html" class="grade-btn">下册</a>
    </div>
    <div class="grade-group">
      <span class="grade-label">四年级</span>
      <a href="四年级上册英语互动学习.html" class="grade-btn">上册</a>
      <a href="四年级下册英语互动学习.html" class="grade-btn">下册</a>
    </div>
    <div class="grade-group">
      <span class="grade-label">五年级</span>
      <a href="english-5a.html" class="grade-btn">上册</a>
      <a href="english-5b.html" class="grade-btn">下册</a>
    </div>
    <a href="english-grammar.html" class="grammar-btn active">📚 语法</a>
  </div>

  <header class="hero">
    <h1>英语语法大全</h1>
    <p>独立总览 · 不按年级或上下册划分</p>
    <div class="action-bar">
      <button class="action-btn" onclick="startRandomPractice()">🎲 随机练习</button>
      <button class="action-btn" onclick="generateStudyPlan()">📅 学习计划</button>
    </div>
  </header>

  <nav class="nav-bar" id="grammarNav" aria-label="语法目录"></nav>
  <main class="wrap" id="grammarApp"></main>
  <footer class="footer">按目录先看分类，再点开规则和例句复习。</footer>

  <script src="grammar-guide-common.js"></script>
  <script src="english-grammar.js"></script>
</body>
</html>
