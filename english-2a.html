const navBar = document.getElementById('navBar');
const container = document.getElementById('container');
let quizState = {};

unitsData.forEach((unit, idx) => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (idx === 0 ? ' active' : '');
  btn.textContent = unit.title;
  btn.addEventListener('click', () => switchUnit(idx));
  navBar.appendChild(btn);

  const section = document.createElement('div');
  section.className = 'unit-section' + (idx === 0 ? ' active' : '');
  section.id = unit.id;

  let html = `<div class="unit-title" style="background:linear-gradient(90deg, ${unit.color}, ${unit.color}dd)">${unit.title} ${unit.subtitle}</div>`;

  html += `<div class="section-card">
    <div class="section-header open" onclick="toggleSection(this)">
      <span class="icon">📦</span> 核心词汇
      <span class="arrow">▼</span>
    </div>
    <div class="section-body open">
      <div class="word-grid">`;

  unit.words.forEach(w => {
    html += `<div class="word-card" onclick="revealWord(this)" data-w="${w.en}">
      <span class="speak-icon">🔊</span>
      <div class="emoji">${w.emoji}</div>
      <div class="english">${w.en}</div>
      <div class="phonetic">${w.ipa || ''}</div>
      <div class="chinese">${w.cn}</div>
      <div class="hint">👆 点击</div>
    </div>`;
  });
  html += `</div></div></div>`;

  html += `<div class="section-card">
    <div class="section-header" onclick="toggleSection(this)">
      <span class="icon">💬</span> 重点句型
      <span class="arrow">▼</span>
    </div>
    <div class="section-body">
      <div class="sentence-list">`;

  unit.sentences.forEach(s => {
    html += `<div class="sentence-card" onclick="revealSentence(this)" data-en="${s.en}">
      <span class="speak-icon">🔊</span>
      <div class="en">${s.en}</div>
      <div class="cn">${s.cn}</div>
    </div>`;
  });
  html += `</div></div></div>`;

  html += `<div class="section-card">
    <div class="section-header" onclick="toggleSection(this)">
      <span class="icon">🎭</span> 课文对话
      <span class="arrow">▼</span>
    </div>
    <div class="section-body">
      <div class="dialogue-box">`;

  unit.dialogue.forEach((d, di) => {
    html += `<div class="line ${di % 2 === 0 ? 'speaker-a' : 'speaker-b'}" onclick="revealDialogue(this)" data-en="${d.text}">
      <div class="speaker-label">${d.speaker}</div>
      <div class="en-text">${d.text}</div>
      <div class="cn-text">${d.cn}</div>
    </div>`;
  });
  html += `</div></div></div>`;

  html += `<div class="section-card">
    <div class="section-header" onclick="toggleSection(this)">
      <span class="icon">🧠</span> 小测验
      <span class="arrow">▼</span>
    </div>
    <div class="section-body">
      <div class="quiz-container" id="quiz-${unit.id}">
        <div class="quiz-progress" id="qp-${unit.id}">第 1 / ${unit.quiz.length} 题</div>
        <div id="qarea-${unit.id}"></div>
        <div class="quiz-score" id="score-${unit.id}">
          <div class="score-emoji">🎉</div>
          <div class="score-text">测验完成！</div>
          <div class="score-detail" id="sd-${unit.id}"></div>
          <button onclick="restartQuiz('${unit.id}')">再做一次</button>
        </div>
      </div>
    </div>
  </div>`;

  section.innerHTML = html;
  container.appendChild(section);

  quizState[unit.id] = { current: 0, score: 0 };
  showQuizQuestion(unit.id);
});

function switchUnit(idx) {
  document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.unit-section').forEach((s, i) => s.classList.toggle('active', i === idx));
}

let speechEnabled = true;
let currentUtterance = null;
let useLocalAudio = false;

function speak(text) {
  if (!speechEnabled || !text) return;
  
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    
    const utter = new SpeechSynthesisUtterance(text);
    const lang = /[\u4e00-\u9fa5]/.test(text) ? 'zh-CN' : 'en-US';
    utter.lang = lang;
    utter.rate = 0.8;
    utter.pitch = 1;
    utter.volume = 1;
    
    const voices = window.speechSynthesis.getVoices();
    if (lang === 'en-US') {
      const englishVoice = voices.find(v => v.lang.includes('en') && v.name && (v.name.includes('David') || v.name.includes('Female') || v.lang === 'en-US'));
      if (englishVoice) utter.voice = englishVoice;
    } else {
      const chineseVoice = voices.find(v => v.lang.includes('zh'));
      if (chineseVoice) utter.voice = chineseVoice;
    }
    
    currentUtterance = utter;
    window.speechSynthesis.speak(utter);
  }
}

function toggleSection(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

function revealWord(card) {
  card.classList.toggle('revealed');
  const word = card.dataset.w;
  if (word) speak(word);
}

function revealSentence(card) {
  card.classList.toggle('revealed');
  const sentence = card.dataset.en || card.dataset.s;
  if (sentence) speak(sentence);
}

function revealDialogue(line) {
  line.classList.toggle('revealed');
  const text = line.dataset.en || line.dataset.t;
  if (text) speak(text);
}

function showQuizQuestion(unitId) {
  const unit = unitsData.find(u => u.id === unitId);
  const state = quizState[unitId];
  const q = unit.quiz[state.current];
  
  if (!q) {
    document.getElementById('qarea-' + unitId).style.display = 'none';
    document.getElementById('score-' + unitId).classList.add('show');
    document.getElementById('sd-' + unitId).textContent = `答对 ${state.score} / ${unit.quiz.length} 题`;
    return;
  }

  document.getElementById('qp-' + unitId).textContent = `第 ${state.current + 1} / ${unit.quiz.length} 题`;
  document.getElementById('score-' + unitId).classList.remove('show');
  
  let html = `<div class="quiz-question">`;
  if (q.emoji) html += `<div class="big-emoji">${q.emoji}</div>`;
  html += `<div class="q-text">${q.q}</div></div>`;
  
  html += `<div class="quiz-options">`;
  q.options.forEach(opt => {
    html += `<div class="quiz-option" onclick="checkAnswer('${unitId}', '${opt}')">${opt}</div>`;
  });
  html += `</div>`;
  
  document.getElementById('qarea-' + unitId).innerHTML = html;
  document.getElementById('qarea-' + unitId).style.display = 'block';
}

function checkAnswer(unitId, answer) {
  const unit = unitsData.find(u => u.id === unitId);
  const state = quizState[unitId];
  const q = unit.quiz[state.current];
  
  document.querySelectorAll('.quiz-option').forEach(opt => {
    if (opt.textContent === q.answer) {
      opt.classList.add('correct');
      if (answer === q.answer) state.score++;
    } else if (opt.textContent === answer && answer !== q.answer) {
      opt.classList.add('wrong');
    }
  });
  
  setTimeout(() => {
    state.current++;
    showQuizQuestion(unitId);
  }, 1500);
}

function restartQuiz(unitId) {
  quizState[unitId] = { current: 0, score: 0 };
  showQuizQuestion(unitId);
}
