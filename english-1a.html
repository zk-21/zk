<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    min-height: 100vh;
    padding-bottom: 60px;
    color: #2f3542;
    -webkit-tap-highlight-color: transparent;

  .language-switcher {

  }
  .lang-btn {
    flex: 0 0 auto;
    min-height: 34px;
    padding: 7px 18px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 18px;
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    background: rgba(255,255,255,0.15);
    transition: all 0.3s;
  }
  .lang-btn:hover { background: rgba(255,255,255,0.25); }
  .lang-btn.active { color: #e65100; background: #fff; border-color: #fff; }
  .course-switcher {

    justify-content: center;

    padding: 12px 8px;

  .grade-group {

    align-items: center;
    gap: 4px;
    padding: 4px 8px;

  .grade-label {

    font-weight: 600;
    padding: 4px 6px;

  .grade-btn {
    min-height: 28px;
    padding: 4px 12px;
    border: none;
    border-radius: 12px;
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    background: rgba(255,255,255,0.12);
    transition: all 0.25s;
  }
  .grade-btn:hover {
    background: rgba(255,255,255,0.2);
    transform: translateY(-1px);
  }
  .grade-btn.active {
    color: #1a1a2e;
    background: linear-gradient(135deg, #ffd93d 0%, #ff9500 100%);

  .grammar-btn {
    min-height: 28px;
    padding: 4px 14px;

    border-radius: 12px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

  .grammar-btn:hover {
    transform: translateY(-1px);

  .header {

  .voice-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .voice-btn {
    padding: 6px 12px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 16px;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 12px;
    cursor: pointer;

  .voice-btn:hover { background: rgba(255,255,255,0.3); }

  .nav-btn {
    flex: 0 0 auto;
    padding: 8px 16px;
    margin-right: 8px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    background: #f0f0f0;
    color: #666;

  .nav-btn.active {

    font-weight: 700;

  .section-card {
    background: white;
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: #fafafa;
    cursor: pointer;
    font-weight: 600;
    color: #333;
  }
  .section-header .icon { margin-right: 8px; }
  .section-header .arrow {
    font-size: 12px;
    transition: transform 0.3s;
  }
  .section-header.open .arrow { transform: rotate(180deg); }
  .section-body {
    padding: 16px;
    display: none;
  }
  .section-body.open { display: block; }
  .word-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);

  .word-card {
    background: linear-gradient(135deg, #fff5f5, #ffe8e8);
    border: 2px solid #ffcccc;
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;

  .word-card:hover { transform: translateY(-4px); }
  .word-card .speak-icon {

    right: 8px;
    font-size: 14px;
    opacity: 0.5;

  .word-card .emoji { font-size: 32px; margin-bottom: 6px; }
  .word-card .english { font-size: 18px; font-weight: 700; color: #333; }
  .word-card .chinese {

    margin-top: 4px;
  }
  .word-card.revealed .chinese { opacity: 1; }
  .word-card .phonetic {

    color: #6c7a89;
    margin-top: 4px;

  }
  .word-card .example {
    font-size: 11px; color: #4caf50; margin-top: 4px;

  .word-card.revealed .example { opacity: 1; }
  .word-card .hint { font-size: 11px; color: #bbb; margin-top: 6px; }
  .word-card .pos-tag {

    padding: 2px 6px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 10px;
    border-radius: 4px;
    margin-left: 4px;

  .word-card .phrases {
    font-size: 10px;
    color: #1e88e5;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .word-card.revealed .phrases { opacity: 1; }
  .word-card .note {
    font-size: 10px;
    color: #ff9800;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s;
    font-style: italic;
  }
  .word-card.revealed .note { opacity: 1; }
  .sentence-list { display: flex; flex-direction: column; gap: 10px; }
  .sentence-card {

    border: 2px solid #b2f5ea;
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }
  .sentence-card .speak-icon {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 14px;
    opacity: 0.5;
  }
  .sentence-card .en { font-size: 16px; font-weight: 600; color: #333; }
  .sentence-card .cn {
    font-size: 13px; color: #666;
    opacity: 0; transition: opacity 0.3s;
    margin-top: 6px;
  }
  .sentence-card.revealed .cn { opacity: 1; }
  .sentence-card .tags {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .sentence-card .func-tag {

    background: linear-gradient(135deg, #4caf50, #43a047);
    color: white;
    font-size: 10px;
    border-radius: 4px;

  .sentence-card .struct-tag {
    padding: 2px 6px;
    background: linear-gradient(135deg, #ff9800, #f57c00);
    color: white;
    font-size: 10px;
    border-radius: 4px;
  }

    font-size: 11px;
    color: #7b1fa2;
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .sentence-card.revealed .grammar-tip { opacity: 1; }
  .dialogue-box {
    background: linear-gradient(135deg, #fff3e0, #ffe0b2);
    border-radius: 12px;
    padding: 20px;
  }
  .dialogue-box .line {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 85%;
    position: relative;
    cursor: pointer;
  }
  .dialogue-box .line.speaker-a { background: #fff; margin-right: auto; }
  .dialogue-box .line.speaker-b { background: #fff8e1; margin-left: auto; }
  .dialogue-box .line .speaker-label { font-size: 11px; color: #999; margin-bottom: 4px; }
  .dialogue-box .line .en-text { font-size: 16px; font-weight: 600; color: #333; }
  .dialogue-box .line .cn-text {
    font-size: 13px; color: #999;
    opacity: 0; transition: opacity 0.3s;
    margin-top: 4px;
  }
  .dialogue-box .line.revealed .cn-text { opacity: 1; }
  .quiz-container { padding: 16px; }
  .quiz-question { text-align: center; margin-bottom: 20px; }
  .quiz-question .q-text { font-size: 18px; font-weight: 700; color: #333; }
  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .quiz-option {
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s;
    text-align: center;
  }
  .quiz-option:hover { border-color: #ff9800; }
  .quiz-option.correct { background: #e8f5e9; border-color: #4caf50; }
  .quiz-option.wrong { background: #ffebee; border-color: #f44336; }
  .quiz-progress { text-align: center; font-size: 13px; color: #999; margin-bottom: 16px; }
  .quiz-score {
    text-align: center;
    padding: 20px;
    background: linear-gradient(135deg, #fff5f5, #ffe8e8);
    border-radius: 12px;
    display: none;
  }
  .quiz-score.show { display: block; }
  .score-emoji { font-size: 64px; }
  .score-text { font-size: 20px; font-weight: 700; margin-top: 8px; }
  .score-detail { font-size: 14px; color: #666; margin-top: 8px; }
  .quiz-score button {
    margin-top: 16px;
    padding: 10px 24px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(90deg, #ff6b6b, #ffa500);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  .footer {
    text-align: center;
    padding: 16px;
    color: #999;
    font-size: 13px;
  }
  .learning-tips {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
  }
  .tip-card {
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    border-left: 4px solid #ff9800;
  }
  .tip-icon {
    font-size: 24px;
    margin-bottom: 6px;
  }
  .tip-title {
    font-size: 13px;
    font-weight: 700;
    color: #ff9800;
    margin-bottom: 4px;
  }
  .tip-content {
    font-size: 11px;
    color: #666;
    line-height: 1.5;
    text-align: left;
  }

  @media (min-width: 600px) {
    .nav-bar {
      justify-content: center;
    }
    .word-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .quiz-options {
      grid-template-columns: repeat(2, 1fr);
    }
    .learning-tips {
      grid-template-columns: repeat(2, 1fr);
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
  }

  @media (min-width: 900px) {
    .word-grid {
      grid-template-columns: repeat(4, 1fr);

    .learning-tips {
      grid-template-columns: repeat(4, 1fr);
    }

    }

    }

  }

  @media (max-width: 480px) {
    .language-switcher {

    }

      padding: 5px 12px;

    }
    .grade-label {
      font-size: 11px;
      padding: 3px 4px;
    }
    .grade-btn {
      padding: 3px 10px;
      font-size: 11px;
    }
    .header {
      padding: 12px;
    }
    .header h1 {
      font-size: 18px;
    }
    .header p {
      font-size: 12px;
    }
    .voice-controls {
      gap: 6px;
    }
    .voice-btn {
      padding: 5px 10px;
      font-size: 11px;
    }
    .speed-label {
      font-size: 10px;
    }
    .speed-slider {
      width: 50px;
    }
    .nav-bar {
      padding: 8px 6px;
    }
    .nav-btn {
      padding: 6px 12px;
      font-size: 13px;
    }
    .container {
      padding: 10px;
    }
    .unit-title {
      padding: 12px;
      font-size: 16px;
    }
    .word-grid {
      grid-template-columns: repeat(2, 1fr);

    }
    .word-card {
      padding: 10px 8px;
    }
    .word-card .emoji {
      font-size: 24px;
    }
    .word-card .english {
      font-size: 15px;
    }
    .word-card .phonetic {
      font-size: 11px;
    }
    .word-card .chinese {
      font-size: 12px;
    }
    .word-card .example {
      font-size: 10px;
    }
    .sentence-card {
      padding: 10px;
    }
    .sentence-card .en {
      font-size: 14px;
    }
    .sentence-card .cn {
      font-size: 12px;
    }
    .dialogue-box {
      padding: 14px;
    }
    .dialogue-box .line {
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .dialogue-box .line .en-text {
      font-size: 14px;
    }
    .quiz-options {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .quiz-option {
      padding: 12px;
      font-size: 14px;
    }
    .learning-tips {
      grid-template-columns: 1fr;
    }
    .tip-card {
      padding: 10px;
    }
    .footer {
      padding: 12px;
      font-size: 12px;
    }
  }
</style>

let speechEnabled = true;
let speechRate = 0.7;
let currentUtterance = null;
let useLocalAudio = false;
let speechInitialized = false;

function speak(text) {
  if (!speechEnabled || !text) return;
  
  if (!speechInitialized) {
    initSpeech();
  }
  
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    
    const utter = new SpeechSynthesisUtterance(text);
    const lang = /[\u4e00-\u9fa5]/.test(text) ? 'zh-CN' : 'en-US';
    utter.lang = lang;
    utter.rate = lang === 'zh-CN' ? Math.min(1, speechRate + 0.2) : speechRate;
    utter.pitch = 1;
    utter.volume = 1;
    
    const voices = window.speechSynthesis.getVoices();
    if (lang === 'en-US') {
      const englishVoice = voices.find(v => v.lang.includes('en') && v.name && (v.name.includes('David') || v.name.includes('Female') || v.lang === 'en-US'));
      if (englishVoice) utter.voice = englishVoice;
    } else {
      const chineseVoice = voices.find(v => v.lang.includes('zh'));
      if (chineseVoice) utter.voice = chineseVoice;
    }
    
    currentUtterance = utter;
    window.speechSynthesis.speak(utter);
  }
}

function initSpeech() {
  if (speechInitialized) return;
  
  try {
    const testUtterance = new SpeechSynthesisUtterance('');
    testUtterance.lang = 'en-US';
    testUtterance.rate = 0.1;
    window.speechSynthesis.speak(testUtterance);
    
    setTimeout(() => {
      window.speechSynthesis.cancel();
    }, 50);
    
    speechInitialized = true;
    const statusEl = document.getElementById('voiceStatus');
    if (statusEl) {
      statusEl.textContent = '🎙️ 语音就绪';
    }
  } catch (e) {
    console.warn('语音初始化失败:', e);
    const statusEl = document.getElementById('voiceStatus');
    if (statusEl) {
      statusEl.textContent = '🔇 语音不可用';
      statusEl.style.color = '#ff6b6b';
    }
  }
}

function toggleVoice() {
  speechEnabled = !speechEnabled;
  const btn = document.getElementById('voiceToggle');
  if (btn) {
    btn.classList.toggle('active', speechEnabled);
    btn.textContent = speechEnabled ? '🔊 自动发音' : '🔇 关闭发音';
  }
}

function changeSpeed(val) {
  speechRate = parseFloat(val);
  const speedVal = document.getElementById('speedVal');
  if (speedVal) {
    speedVal.textContent = speechRate.toFixed(1);
  }
}

function toggleSection(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

function revealWord(card) {
  card.classList.toggle('revealed');
  const word = card.dataset.w;
  if (word) speak(word);
}

function revealSentence(card) {
  card.classList.toggle('revealed');
  const sentence = card.dataset.en || card.dataset.s;
  if (sentence) speak(sentence);
}

function revealDialogue(line) {
  line.classList.toggle('revealed');
  const text = line.dataset.en || line.dataset.t;
  if (text) speak(text);
}

function showQuizQuestion(unitId) {
  const unit = unitsData.find(u => u.id === unitId);
  const state = quizState[unitId];
  const q = unit.quiz[state.current];
  
  if (!q) {
    document.getElementById('qarea-' + unitId).style.display = 'none';
    document.getElementById('score-' + unitId).classList.add('show');
    document.getElementById('sd-' + unitId).textContent = `答对 ${state.score} / ${unit.quiz.length} 题`;
    return;
  }

  document.getElementById('qp-' + unitId).textContent = `第 ${state.current + 1} / ${unit.quiz.length} 题`;
  document.getElementById('score-' + unitId).classList.remove('show');
  
  let html = `<div class="quiz-question">`;
  if (q.emoji) html += `<div class="big-emoji">${q.emoji}</div>`;
  html += `<div class="q-text">${q.q}</div></div>`;
  
  html += `<div class="quiz-options">`;
  q.options.forEach(opt => {
    html += `<div class="quiz-option" onclick="checkAnswer('${unitId}', '${opt}')">${opt}</div>`;
  });
  html += `</div>`;
  
  document.getElementById('qarea-' + unitId).innerHTML = html;
  document.getElementById('qarea-' + unitId).style.display = 'block';
}

function checkAnswer(unitId, answer) {
  const unit = unitsData.find(u => u.id === unitId);
  const state = quizState[unitId];
  const q = unit.quiz[state.current];
  
  document.querySelectorAll('.quiz-option').forEach(opt => {
    if (opt.textContent === q.answer) {
      opt.classList.add('correct');
      if (answer === q.answer) state.score++;
    } else if (opt.textContent === answer && answer !== q.answer) {
      opt.classList.add('wrong');
    }
  });
  
  setTimeout(() => {
    state.current++;
    showQuizQuestion(unitId);
  }, 1500);
}

function restartQuiz(unitId) {
  quizState[unitId] = { current: 0, score: 0 };
  showQuizQuestion(unitId);
}
window.unitsData = unitsData;
</script>
